[project]
name = "dacapo"
version = "0.0.1"
description = "Da Capo: measuring and steering musical structure in AI song models"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "ninondev"}]
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pretty_midi>=0.2.10",
    "mido>=1.3",
    "soundfile>=0.12",
    "librosa>=0.10",
    "mir_eval>=0.7",
    "torch>=2.2",
    "torchcrepe>=0.0.23",
    "swift-f0>=0.3",
    "torchfcpe>=0.0.4",
]

[project.optional-dependencies]
# basic-pitch pins TensorFlow on some platforms; install it with
#   uv pip install --no-deps basic-pitch && uv pip install onnxruntime resampy scikit-learn
transcription = ["onnxruntime>=1.17", "resampy>=0.4", "scikit-learn>=1.3"]
dev = ["pytest>=8", "matplotlib>=3.8"]

[project.urls]
Repository = "https://github.com/ninondev/DaCapo"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dacapo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
